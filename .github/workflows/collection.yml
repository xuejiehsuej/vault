name: Process Vault Issue

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write

# Different Issues can run concurrently. A newer edit of the same Issue supersedes
# an older queued edit; commits are retried against current main by commit_issue.py.
concurrency:
  group: vault-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  collect:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      (startsWith(github.event.issue.title, '[ADD]') || startsWith(github.event.issue.title, '[REMOVE]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and commit collection
        id: collect
        env:
          RESULT_PATH: ${{ runner.temp }}/vault-result.json
        run: python scripts/commit_issue.py
      - name: Record result on Issue
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT_PATH: ${{ runner.temp }}/vault-result.json
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
        with:
          script: |
            const fs = require('fs');
            const { execFileSync } = require('child_process');
            const owner = context.repo.owner, repo = context.repo.repo;
            const issue_number = context.issue.number;
            let result = {ok:false, message:'处理未完成，请查看 Actions 日志。'};
            try { result = JSON.parse(fs.readFileSync(process.env.RESULT_PATH, 'utf8')); } catch {}
            const ok = result.ok && process.env.COLLECT_OUTCOME === 'success';
            const sha = ok ? execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim() : '';
            const marker = '<!-- vault-automation -->';
            const body = ok
              ? `${marker}\n<!-- vault-commit:${sha} -->\n${result.message}\n\n藏品 ID：\`${result.id}\`\n${result.category ? `分类：\`${result.category}\`\n` : ''}\n数据已保存，等待 Pages 发布。部署成功后会自动更新此消息并关闭 Issue。`
              : `${marker}\n收录未完成：${result.message}\n\n请修改表单内容，或重新打开 Issue 重试。`;
            const comments = await github.paginate(github.rest.issues.listComments,{owner,repo,issue_number});
            const existing = comments.find(x=>x.user?.login==='github-actions[bot]' && x.body?.includes(marker));
            if(existing) await github.rest.issues.updateComment({owner,repo,comment_id:existing.id,body});
            else await github.rest.issues.createComment({owner,repo,issue_number,body});
            if(ok){
              if(context.payload.issue.state === 'closed') await github.rest.issues.update({owner,repo,issue_number,state:'open'});
              try { await github.rest.issues.createLabel({owner,repo,name:'vault-pending',color:'b8a373',description:'Data saved; awaiting Pages deployment'}); } catch(e) { if(e.status!==422) throw e; }
              await github.rest.issues.addLabels({owner,repo,issue_number,labels:['vault-pending']});
            } else {
              try { await github.rest.issues.removeLabel({owner,repo,issue_number,name:'vault-pending'}); } catch(e) { if(e.status!==404) throw e; }
            }
